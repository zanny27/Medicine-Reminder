name: CI/CD Pipeline - Medicine Reminder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image Locally for Test
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/medicine-reminder:latest .

      - name: Run Smoke Test inside Container
        run: |
          # Start container in detached mode
          docker run -d --name test-app -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/medicine-reminder:latest
          
          # Allow server 3 seconds to spin up
          sleep 3
          
          # Test if HTTP server responds to /api or root route
          curl --fail http://localhost:5000/ || exit 1
          
          # Clean up test container
          docker stop test-app && docker rm test-app

      - name: Push Image to Docker Hub
        if: success()
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/medicine-reminder:latest